<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikroTik AI Assistant - لوحة التحكم الحية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>MikroTik AI Assistant</h1>
        <a href="connect.html" style="float: left; text-decoration: none; background-color: #007bff; color: white; padding: 8px 15px; border-radius: 5px; margin-bottom: 15px;">إضافة اتصال جديد</a>
        <p>لوحة التحكم الحية - محاكاة للإصدار الأولي (MVP)</p>

        <div class="status-card" id="connection-status">
            <h2>حالة الاتصال</h2>
            <p id="status-text">جاري التحميل...</p>
        </div>

        <div class="dashboard-grid">
            <div class="metric-card">
                <h3>استخدام المعالج (CPU)</h3>
                <p id="cpu-load">--%</p>
            </div>
            <div class="metric-card">
                <h3>الذاكرة الحرة (RAM)</h3>
                <p id="free-memory">-- MiB</p>
            </div>
            <div class="metric-card">
                <h3>وقت التشغيل (Uptime)</h3>
                <p id="uptime">--</p>
            </div>
        </div>

        <div class="logs-section">
            <h2>تحليل سجلات النظام (AI Analysis)</h2>
            <button onclick="fetchLogs()">تحديث السجلات والتحليل</button>
            <div id="logs-container">
                <p>اضغط على الزر أعلاه لسحب وتحليل السجلات.</p>
            </div>
        </div>
    </div>

<script src="./static/dashboard.js"></script>
</body>
</html>
